          - Intervalle d'analyse: 60 secondes
          
          Scénarios détectés:
          • Pod consommant soudainement plus de CPU que la normale
          • Utilisation mémoire anormalement élevée
          • Taux de redémarrage inhabituel
          • Connexions réseau atypiques
          
          Visualiser les logs:
          kubectl logs -n ai-monitoring -l app=anomaly-detector -f
          
          🔮 2. LOAD PREDICTION
          ----------------------
          Composant: load-predictor
          Fonctionnalités:
          - Prédiction de charge CPU pour l'heure suivante
          - Prédiction de charge mémoire
          - Prédiction de trafic réseau
          - Détection de tendances (hausse/baisse/stable)
          - Recommandations automatiques de scaling
          
          Prédictions fournies:
          • Prévision de pic de trafic web (ex: 10h00)
          • Anticipation de charge avant lancement marketing
          • Prédiction de consommation ressources
          
          Visualiser les logs:
          kubectl logs -n ai-monitoring -l app=load-predictor -f
          
          📊 3. RECOMMENDATIONS ON PODS
          ------------------------------
          Le système génère automatiquement:
          
          Recommandations CPU/RAM:
          • "Augmenter CPU de X% sur pod Y"
          • "Réduire memory limit sur pod Z (sous-utilisé)"
          • "Activer HPA pour deployment X"
          
          Recommandations de placement:
          • "Distribuer les pods sur différents nodes"
          • "Éviter la co-localisation de services gourmands"
          • "Node X surcharger - rebalancer"
          
          Recommandations d'optimisation:
          • "Merger service X et Y (faible utilisation)"
          • "Séparer microservice Z (goulot d'étranglement)"
          • "Optimiser les requests/limits"
          
          Accéder aux recommandations:
          cat /tmp/load-prediction.json | jq '.recommendations'
          
          IV. HIGH AVAILABILITY & RESILIENCE (namespace: ha-testing)
          ===========================================================
          
          ✅ Application HA déployée: ha-webapp
          Configuration:
          - 3 réplicas
          - Anti-affinity (distribution sur nodes différents)
          - Liveness probe (redémarrage auto si unhealthy)
          - Readiness probe (trafic uniquement vers pods ready)
          - Resource limits configurés
          
          Tests disponibles:
          
          1️⃣  Pod Auto-Restart:
          kubectl delete pod -n ha-testing -l app=ha-webapp --force
          → Kubernetes recrée automatiquement le pod
          
          2️⃣  Node Failure Simulation:
          kubectl drain worker1 --ignore-daemonsets --delete-emptydir-data
          → Pods reschedulés automatiquement sur autres nodes
          kubectl uncordon worker1  # Pour restaurer
          
          3️⃣  Automatic Rescheduling:
          kubectl cordon worker2  # Marque le node comme non-schedulable
          kubectl delete pod -n ha-testing <pod-name>
          → Nouveau pod créé sur un node disponible
          
          Script de test automatique:
          ~/resilience-tests.sh
          
          V. AUTOSCALING VALIDATION (namespace: demo-hpa)
          ================================================
          
          ✅ Horizontal Pod Autoscaler (HPA) configuré
          Application: webapp-hpa
          Configuration:
          - CPU Target: 50%
          - Min replicas: 1
          - Max replicas: 10
          
          Tests d'autoscaling:
          
          1️⃣  Vérifier HPA status:
          kubectl get hpa -n demo-hpa
          
          2️⃣  Scale Up sous charge:
          kubectl apply -f ~/load-generator.yaml
          # Attendre 2-3 minutes
          kubectl get pods -n demo-hpa
          → Nombre de pods augmente automatiquement
          
          3️⃣  Scale Down après charge:
          kubectl delete pod load-generator -n demo-hpa
          # Attendre 5 minutes
          kubectl get pods -n demo-hpa
          → Nombre de pods diminue automatiquement
          
          4️⃣  Monitoring du scaling:
          kubectl get hpa -n demo-hpa --watch
          
          VI. ACCÈS AUX INTERFACES WEB
          =============================
          
          Prometheus:
          http://{{ ansible_default_ipv4.address }}:30090
          • Visualiser les métriques
          • Exécuter des requêtes PromQL
          • Voir les alertes actives
          
          Grafana:
          http://{{ ansible_default_ipv4.address }}:30080
          Username: admin
          Password: (see Ansible vault)
          • Dashboards pré-configurés
          • Visualisation temps réel
          • Alerting intégré
          
          Alertmanager:
          http://{{ ansible_default_ipv4.address }}:30093
          • Gestion des alertes
          • Configuration des notifications
          • Silence des alertes
          
          VII. COMMANDES UTILES
          =====================
          
          Monitoring général:
          kubectl get pods --all-namespaces
          kubectl top nodes
          kubectl top pods --all-namespaces
          
          AI Anomaly Detection:
          kubectl logs -n ai-monitoring -l app=anomaly-detector -f
          cat /tmp/anomalies.json | jq
          
          Load Prediction:
          kubectl logs -n ai-monitoring -l app=load-predictor -f
          cat /tmp/load-prediction.json | jq
          
          HPA Monitoring:
          kubectl get hpa -n demo-hpa --watch
          kubectl describe hpa webapp-hpa -n demo-hpa
          
          HA Testing:
          kubectl get pods -n ha-testing -o wide
          kubectl describe pod -n ha-testing <pod-name>
          
          VIII. DÉMONSTRATIONS COMPLÈTES
          ==============================
          
          📋 DEMO 1: Anomaly Detection
          -----------------------------
          1. Créer un pod avec charge CPU anormale:
             kubectl apply -f - <<EOF
             apiVersion: v1
             kind: Pod
             metadata:
               name: cpu-spike
               namespace: demo-apps
             spec:
               containers:
               - name: stress
                 image: polinux/stress
                 command: ["stress"]
                 args: ["--cpu", "4", "--timeout", "300s"]
             EOF
          
          2. Observer l'anomalie détectée:
             kubectl logs -n ai-monitoring -l app=anomaly-detector -f
          
          3. Vérifier dans Prometheus:
             http://{{ ansible_default_ipv4.address }}:30090
             Query: rate(container_cpu_usage_seconds_total[5m])
          
          📋 DEMO 2: Load Prediction & Scaling
          -------------------------------------
          1. Observer la prédiction actuelle:
             kubectl logs -n ai-monitoring -l app=load-predictor | tail -30
          
          2. Générer une charge:
             kubectl apply -f ~/load-generator.yaml
          
          3. Observer HPA en action:
             kubectl get hpa -n demo-hpa --watch
          
          4. Vérifier la prédiction mise à jour:
             kubectl logs -n ai-monitoring -l app=load-predictor | tail -30
          
          📋 DEMO 3: High Availability
          -----------------------------
          1. Vérifier distribution des pods:
             kubectl get pods -n ha-testing -o wide
          
          2. Supprimer un pod:
             kubectl delete pod -n ha-testing <pod-name> --force
          
          3. Observer recréation automatique:
             kubectl get pods -n ha-testing --watch
          
          4. Simuler panne node:
             kubectl drain worker1 --ignore-daemonsets --delete-emptydir-data
             kubectl get pods -n ha-testing -o wide
             kubectl uncordon worker1
          
          IX. SCORE D'ÉVALUATION DÉTAILLÉ
          ================================
          
          ✅ Automatic Anomaly Detection (3/3 points)
