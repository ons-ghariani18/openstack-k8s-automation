---
- name: Create demo-apps namespace (idempotent)
  become_user: "{{ k8s_user }}"
  shell: kubectl create namespace demo-apps --dry-run=client -o yaml | kubectl apply -f -
  changed_when: false

- name: Deploy demo workloads
  become_user: "{{ k8s_user }}"
  shell: "{{ item }}"
  loop:
    - kubectl create deployment nginx --image=nginx --replicas=3 -n demo-apps
    - kubectl expose deployment nginx --port=80 --type=NodePort -n demo-apps
    - kubectl create deployment redis --image=redis:alpine --replicas=2 -n demo-apps
    - kubectl create deployment apache --image=httpd --replicas=2 -n demo-apps
    - kubectl expose deployment apache --port=80 --type=NodePort -n demo-apps
  changed_when: false
  failed_when: false

- name: Wait for pods Running
  become_user: "{{ k8s_user }}"
  shell: kubectl get pods -n demo-apps --no-headers | grep -c Running
  register: running_pods
  until: running_pods.stdout | int >= 7
  retries: 50
  delay: 15
  changed_when: false

- name: List resources
  become_user: "{{ k8s_user }}"
  command: kubectl get all -n demo-apps
  register: deployments
  changed_when: false

- debug:
    msg: "{{ deployments.stdout_lines }}"
