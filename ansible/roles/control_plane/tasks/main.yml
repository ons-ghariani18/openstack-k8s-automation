---
- name: Check if cluster is already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_init

- name: kubeadm init (no pod CIDR override, Calico default)
  command: >
    kubeadm init
    --apiserver-advertise-address={{ ansible_default_ipv4.address }}
    --node-name=master
  when: not kubeadm_init.stat.exists

- name: Create .kube directory
  file:
    path: "/home/{{ k8s_user }}/.kube"
    state: directory
    owner: "{{ k8s_user }}"
    group: "{{ k8s_user }}"
    mode: '0755'

- name: Copy admin kubeconfig
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ k8s_user }}/.kube/config"
    remote_src: true
    owner: "{{ k8s_user }}"
    group: "{{ k8s_user }}"
    mode: '0600'

- name: Generate join command
  command: kubeadm token create --print-join-command
  register: join_command
  changed_when: false

- name: Save join command
  copy:
    content: "{{ join_command.stdout }}"
    dest: "/home/{{ k8s_user }}/join-command.sh"
    mode: '0700'
    owner: "{{ k8s_user }}"
    group: "{{ k8s_user }}"

- name: Expose join command to workers play
  add_host:
    name: K8S_TOKEN_HOLDER
    join_command: "{{ join_command.stdout }}"
