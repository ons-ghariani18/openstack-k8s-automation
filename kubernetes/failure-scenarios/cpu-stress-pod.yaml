apiVersion: v1
kind: Pod
metadata:
  name: cpu-stress
  namespace: demo-apps
  labels: {app: stress-test}
spec:
  containers:
  - name: stress
    image: polinux/stress
    resources:
      limits: {cpu: "1", memory: "512Mi"}
      requests: {cpu: "0.5", memory: "256Mi"}
    command: ["stress"]
    args: ["--cpu", "2", "--timeout", "600s"]
